<style>

.imm #xit{display:block}.imm.bar #xit{display:none}
.tag.prot{background:#dbeafe;color:#1e40af}
.imm .vb{position:absolute;top:0;left:0;right:0;transform:translateY(-110%)}.imm.bar .vb{transform:none}

@keyframes s{to{transform:rotate(360deg)}}@keyframes fl{to{transform:translate(-24px,-16px) scale(1.18)}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
<!-- Bump the number after ?v= every time you edit config.js so browsers never serve an old copy -->
<script src="config.js?v=4"></script>
<script>
if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') { document.body.innerHTML = '<p style="padding:30px;font-family:sans-serif">config.js was not found or is incomplete.</p>'; throw new Error('config.js missing'); }
if (typeof supabase === 'undefined' || typeof pdfjsLib === 'undefined') { document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif"><p>Required libraries failed to load. Please check your internet connection.</p><button onclick="location.reload()" style="padding:10px 16px;cursor:pointer">Reload</button></div>'; throw new Error('libraries missing'); }
const B = Object.assign({ name: 'Computer Maintenance & Networking', accent: 'Maintenance', badge: 'FULL GUIDE MODULE', tagline: 'Complete Course Guide • Reference Module', chips: ['💽 Software', '🛠 Troubleshooting', '🌐 Networking'], owner: '', showUser: true, color1: '#0891b2', color2: '#2563eb' }, typeof BRAND !== 'undefined' ? BRAND : {});
if (!B.owner) B.owner = B.name;
if (!Array.isArray(B.chips)) B.chips = [];
document.title = B.name; document.documentElement.style.setProperty('--pr', B.color1); document.documentElement.style.setProperty('--pr2', B.color2);
const MINPW = 8;
const $ = s => document.querySelector(s), app = $('#app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heroTitle = () => B.accent ? e(B.name).replace(e(B.accent), () => '<span>' + e(B.accent) + '</span>') : e(B.name);
const fmtD = d => new Date(d).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
const mb = n => (n / 1048576).toFixed(1) + ' MB';
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let tries = 0, me = null, tab = 'lib', mode = 'in', docs = [], pdf = null, sizes = [], cur = null, zoom = 1, obs = null, curPage = 1, saveT, docTok = 0, imm = false, fgEmail = '', lastW = 0, rt = 0, vt = 0, lgRows = [], lgDone = false, progMap = {}, hs = 0, prevOri = '', immBusy = false, hold = 0, wmT = 0;
let rec = /type=recovery/.test(location.hash + location.search);
const hp = new URLSearchParams(location.hash.slice(1));
const linkErr = hp.get('error_description');
const STL = { approved: 'Approved', pending: 'Pending', blocked: 'Blocked' };

function toast(m) {
  const t = $('#toast'), h = fsEl() || document.body;
  if (t.parentNode !== h) h.appendChild(t);
  t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3600);
}
const busy = (b, on) => { if (b) b.disabled = on; };
const hero = sub => `<div class="hero"><svg class="deco" viewBox="0 0 160 160" fill="none" stroke="#67e8f9" stroke-width="1.5" aria-hidden="true"><path d="M20 120L60 70L100 90L140 30M60 70L50 30M100 90L130 130" opacity=".6"/><g fill="#0a1630"><circle cx="20" cy="120" r="7"/><circle cx="60" cy="70" r="9"/><circle cx="100" cy="90" r="7"/><circle cx="140" cy="30" r="8"/><circle cx="50" cy="30" r="6"/><circle cx="130" cy="130" r="6"/></g></svg><div class="badge">${e(B.badge)}</div><h1>${heroTitle()}</h1><p>${sub}</p>${B.tagline ? `<div class="tg">${e(B.tagline)}</div>` : ''}<div class="chips">${B.chips.map(c => `<b>${e(c)}</b>`).join('')}</div></div>`;
const pwField = (id, label, ac) => `<label for="${id}">${label}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="eye" data-a="eye" data-t="${id}" aria-label="Show or hide password">👁</button></div>`;
const live = () => { const t = ++vt; return () => t === vt && !!$('#main'); };
const fail = er => { const m = $('#main'); if (m) m.innerHTML = `<div class="card center"><div class="ico">⚠️</div><p>${e(er?.message || er)}</p><button class="btn g" data-a="reload">Try again</button></div>`; };

/* ---------- dialogs (replace prompt/confirm). `p` is trusted HTML: callers must escape ---------- */
function dlg({ t, p = '', f = [], ok = 'Confirm', danger }) {
  return new Promise(res => {
    const prev = document.activeElement, m = document.createElement('div'); m.className = 'mo';
    m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="${e(t)}"><h3>${e(t)}</h3>${p ? `<p class="mu">${p}</p>` : ''}${f.map((x, i) => `<label for="f${i}">${e(x.l)}</label>${x.area
      ? `<textarea id="f${i}" rows="3" maxlength="${+x.max || 1000}"></textarea>`
      : `<input id="f${i}" type="${x.type || 'text'}" autocomplete="${x.ac || 'off'}"${x.max ? ` maxlength="${+x.max}"` : ''}${x.min != null ? ` min="${+x.min}"` : ''}${x.maxv != null ? ` max="${+x.maxv}"` : ''}>`}`).join('')}<div class="ra"><button class="btn g" data-k="0">Cancel</button><button class="btn ${danger ? 'r' : ''}" data-k="1">${e(ok)}</button></div></div>`;
    (fsEl() || document.body).appendChild(m);
    f.forEach((x, i) => { if (x.v != null) m.querySelector('#f' + i).value = x.v; });
    const done = v => { m.remove(); setTimeout(() => { try { prev && prev.focus && prev.focus(); } catch (_) {} }, 0); res(v); };
    m.onclick = ev => { const k = ev.target.dataset.k; if (ev.target === m || k === '0') done(null); else if (k === '1') done(f.map((_, i) => m.querySelector('#f' + i).value)); };
    m.onkeydown = ev => { if (ev.key === 'Escape') { ev.preventDefault(); done(null); } if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); m.querySelector('[data-k="1"]').click(); } };
    (m.querySelector('input,textarea') || m.querySelector('[data-k="1"]')).focus();
  });
}

/* ---------- routing ---------- */
async function route() {
  const my = ++rt; vt++;
  if (rec) return resetView();
  let { data: { session } } = await sb.auth.getSession();
  if (my !== rt) return;
  if (session) {
    const { error } = await sb.auth.getUser();
    if (my !== rt) return;
    if (error && [401, 403, 404].includes(error.status)) { await sb.auth.signOut({ scope: 'local' }); session = null; toast('Your session has ended. Please sign in again.'); }
  }
  if (!session) { me = null; return authView(); }
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (my !== rt) return;
  me = data;
  if (!me) {
    if (!error && ++tries < 4) { await new Promise(r => setTimeout(r, 1200)); return route(); }
    tries = 0;
    app.innerHTML = `<div class="auth"><div class="card center"><div class="ico">⚠️</div><h2>Account unavailable</h2><p>${e(error?.message || 'Your account was not found. It may have been removed by your instructor.')}</p><button class="btn" data-a="refresh">Try again</button> <button class="btn g" data-a="out">Sign out</button></div></div>`;
    return;
  }
  tries = 0;
  if (me.status === 'approved') return appView();
  const blocked = me.status === 'blocked';
  app.innerHTML = `<div class="auth"><div class="card center"><div class="ico">${blocked ? '⛔' : '⏳'}</div><h2>${blocked ? 'Account suspended' : 'Awaiting approval'}</h2><p>${blocked ? 'Please contact your instructor.' : 'Your registration was received. Once your instructor approves it, refresh this page.'}</p><p><small>${e(me.email)}</small></p><button class="btn" data-a="refresh">Refresh</button> <button class="btn g" data-a="out">Sign out</button></div></div>`;
}
// NOTE: never await other supabase calls directly inside this callback (deadlock risk), so work is deferred.
sb.auth.onAuthStateChange(ev => {
  if (ev === 'SIGNED_OUT' && !rec) setTimeout(() => { closeDoc(); route(); }, 0);
  if (ev === 'PASSWORD_RECOVERY') { rec = true; setTimeout(resetView, 0); }
});
async function recheck() {
  if (document.visibilityState !== 'visible' || !me || rec) return;
  const { data, error } = await sb.from('profiles').select('status,role').eq('id', me.id).maybeSingle();
  if (error || !me) return; // temporary network problem: do not kick the reader out
  if (!data || data.status !== me.status || data.role !== me.role) { closeDoc(); route(); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProg(); else recheck(); });
addEventListener('pagehide', saveProg);
setInterval(recheck, 30000);

/* ---------- auth ---------- */
function authView() {
  if (mode === 'fg') return fgView(false);
  const v = { em: $('#em')?.value || '', nm: $('#nm')?.value || '', pw: $('#pw')?.value || '' }, reg = mode === 'up';
  app.innerHTML = `<div class="auth">${hero(reg ? 'Create your student account' : 'Sign in to continue')}
  <div class="card"><div class="tabs"><button class="${reg ? '' : 'on'}" data-a="m-in">Sign in</button><button class="${reg ? 'on' : ''}" data-a="m-up">Register</button></div>
  ${reg ? '<label for="nm">Full name</label><input id="nm" autocomplete="name" maxlength="80">' : ''}
  <label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email">
  ${pwField('pw', reg ? `Password (min. ${MINPW} characters)` : 'Password', reg ? 'new-password' : 'current-password')}

    push(p.jpg); txt('\nendstream\nendobj\n');
  });
  const xo = len;
  let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
  for (let n = 1; n <= total; n++) x += String(off[n]).padStart(10, '0') + ' 00000 n \n';
  txt(x + `trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}
async function flattenPdf(buf, { long = 2400, q = .8, onProgress } = {}) {
  const doc = await pdfjsLib.getDocument({ data: buf, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true, standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/', isEvalSupported: false }).promise;

    const n = doc.numPages, pages = [];
    for (let i = 1; i <= n; i++) {
      if (onProgress) onProgress(i, n);
      const p = await doc.getPage(i), v1 = p.getViewport({ scale: 1 });
      const s = Math.min(long / Math.max(v1.width, v1.height), Math.sqrt(9e6 / (v1.width * v1.height))), vp = p.getViewport({ scale: s });
      const c = document.createElement('canvas'), x = c.getContext('2d');
      c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      await p.render({ canvasContext: x, viewport: vp }).promise;
      tileWM(x, c.width, c.height, B.owner, c.width / 30, .11, -.5);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      if (!blob) throw new Error('Image encoding failed');
      pages.push({ w: c.width, h: c.height, pw: v1.width, ph: v1.height, jpg: new Uint8Array(await blob.arrayBuffer()) });
      c.width = c.height = 0; p.cleanup();

}
async function protectDoc(b, id) {
  const d = docs.find(x => x.id === id); if (!d || isProt(d)) return;
  if (!await dlg({ t: 'Protect this file?', p: 'Every page becomes a watermarked image and the original file is replaced. This can take a few minutes for large files; keep this tab open.', ok: 'Protect' })) return;
  const old = b.textContent; busy(b, true);
  try {
    b.textContent = '⏳ Downloading…';
    const { data, error } = await sb.storage.from('documents').createSignedUrl(d.file_path, 120);
    if (error) throw error;
    const res = await fetch(data.signedUrl); if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await flattenPdf(await res.arrayBuffer(), { ...QL.s, onProgress: (i, n) => { b.textContent = `⏳ ${i}/${n}`; } });
    if (blob.size > 52428800) throw new Error('Protected file is ' + mb(blob.size) + ' (limit 50 MB). Upload the original again with Compact quality.');
    b.textContent = '⏳ Saving…';
    const path = uid() + '.p.pdf';
    const u = await sb.storage.from('documents').upload(path, blob, { contentType: 'application/pdf' });
    if (u.error) throw u.error;
    const r = await sb.from('documents').update({ file_path: path, size_bytes: blob.size }).eq('id', id);
    if (r.error) { await sb.storage.from('documents').remove([path]); throw r.error; }
    await sb.storage.from('documents').remove([d.file_path]);
    toast('✅ File protected'); upView();
  } catch (x) { busy(b, false); b.textContent = old; toast('Protection failed: ' + (x?.message || x)); }
}

async function upload(b) {
  const f = $('#f').files[0], t = $('#t').value.trim();
  if (!t || !f) return toast('A title and a file are required');
  if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) return toast('Only PDF files are allowed');
  if (f.size > 52428800) return toast('File exceeds 50 MB');
  const head = new TextDecoder('latin1').decode(await f.slice(0, 1024).arrayBuffer());
  if (!head.includes('%PDF-')) return toast('This file is not a valid PDF');
  const prot = !!$('#pt')?.checked, ql = QL[$('#pq')?.value] || QL.s;
  busy(b, true);
  const reset = () => { busy(b, false); b.textContent = '⬆️ Upload'; };
  let blob = f;
  if (prot) {
    b.textContent = '⏳ Protecting…';
    try { blob = await flattenPdf(await f.arrayBuffer(), { ...ql, onProgress: (i, n) => { b.textContent = `⏳ Protecting ${i}/${n}`; } }); }
    catch (x) { reset(); return toast('Could not protect this PDF: ' + (x?.message || x)); }
    if (blob.size > 52428800) { reset(); return toast('Protected file is ' + mb(blob.size) + ' (limit 50 MB). Choose Compact quality or split the PDF.'); }
  }
  b.textContent = '⏳ Uploading...';
  const path = uid() + (prot ? '.p.pdf' : '.pdf');
  const u = await sb.storage.from('documents').upload(path, blob, { contentType: 'application/pdf' });
  if (u.error) { reset(); return toast(u.error.message); }
  const r = await sb.from('documents').insert({ title: t, description: $('#ds').value.trim(), file_path: path, size_bytes: blob.size });
  if (r.error) { await sb.storage.from('documents').remove([path]); reset(); return toast(r.error.message); }
  toast('✅ Uploaded'); upView();
}
const stRow = s => `<div class="row"><div class="i"><b>${e(s.full_name || '—')}${s.role === 'admin' ? ' 👑' : ''}</b><small>${e(s.email)}${s.created_at ? ' • ' + e(fmtD(s.created_at)) : ''}</small></div><span class="tag ${e(s.status)}">${STL[s.status] || e(s.status)}</span>`

const genPw = () => { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = crypto.getRandomValues(new Uint32Array(12)); return [...a].map(n => c[n % c.length]).join(''); };

/* ---------- events ---------- */
async function act(b) {
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'm-in' || a === 'm-up' || a === 'm-fg') { mode = a === 'm-up' ? 'up' : a === 'm-fg' ? 'fg' : 'in'; authView(); }
  else if (a === 'auth') await doAuth(b);
  else if (a === 'fg') await doFg(b);
  else if (a === 'setnew') await doSetNew(b);
  else if (a === 'cancelrec') { rec = false; history.replaceState(null, '', location.pathname); await sb.auth.signOut(); mode = 'in'; route(); }
  else if (a === 'eye') { const i = $('#' + b.dataset.t); const h = i.type === 'password'; i.type = h ? 'text' : 'password'; b.textContent = h ? '🙈' : '👁'; }
  else if (a === 'out') { closeDoc(); await sb.auth.signOut(); me = null; mode = 'in'; tab = 'lib'; route(); }
  else if (a === 'refresh') route();
  else if (a === 'reload') appView();
  else if (a === 'tab') { tab = b.dataset.t; appView(); }
  else if (a === 'open') openDoc(id);
  else if (a === 'close') closeDoc();
  else if (a === 'land') immersive(!imm);
  else if (a === 'zi' || a === 'zo') { if (!pdf) return; zoom = Math.max(.6, Math.min(2.5, zoom + (a === 'zi' ? .25 : -.25))); relayout(); }
  else if (a === 'jump') {
    if (!pdf) return;
    const r = await dlg({ t: 'Go to page', f: [{ l: `Page number (1–${pdf.numPages})`, type: 'number', min: 1, maxv: pdf.numPages, v: curPage }], ok: 'Go' }); if (!r) return;
    const n = Math.round(+r[0]);
    if (!(n >= 1 && n <= pdf.numPages)) return toast('Enter a number between 1 and ' + pdf.numPages);
    goPage(n);
  }
  else if (a === 'upload') await upload(b);
  else if (a === 'protect') await protectDoc(b, id);
  else if (a === 'edoc') {
    const d = docs.find(x => x.id === id); if (!d) return;
    const r = await dlg({ t: 'Edit file details', f: [{ l: 'Title', v: d.title, max: 200 }, { l: 'Description (optional)', v: d.description || '', area: 1, max: 1000 }], ok: 'Save' }); if (!r) return;
    const t = r[0].trim(); if (!t) return toast('Title is required');
    const u = await sb.from('documents').update({ title: t, description: r[1].trim() }).eq('id', id);
    toast(u.error ? u.error.message : '✅ Saved'); upView();
  }
  else if (a === 'deldoc') {
    if (!await dlg({ t: 'Delete this file?', p: 'The file will be permanently deleted for everyone.', ok: 'Delete', danger: 1 })) return;
    busy(b, true);
    const d = docs.find(x => x.id === id), r = await sb.from('documents').delete().eq('id', id);
    if (r.error) { busy(b, false); return toast(r.error.message); }
    if (d) await sb.storage.from('documents').remove([d.file_path]);
    upView();
  }
  else if (a === 'setst') { busy(b, true); const r = await sb.from('profiles').update({ status: b.dataset.v }).eq('id', id); if (r.error) toast(r.error.message); stView(); }
  else if (a === 'setrole') {
    const up = b.dataset.v === 'admin';
    if (!await dlg({ t: up ? 'Grant admin access?' : 'Remove admin access?', p: up ? 'This person will be able to upload files and manage all students.' : 'This person will become a regular student.', ok: 'Confirm' })) return;
    busy(b, true); const r = await sb.from('profiles').update({ role: b.dataset.v }).eq('id', id); if (r.error) toast(r.error.message); stView();
  }
  else if (a === 'chpw') {
    const r = await dlg({ t: 'Change your password', f: [{ l: `New password (min. ${MINPW} characters)`, type: 'password', ac: 'new-password' }, { l: 'Confirm new password', type: 'password', ac: 'new-password' }], ok: 'Update' }); if (!r) return;
    if (r[0].length < MINPW) return toast(`Password must be at least ${MINPW} characters`);
    if (r[0] !== r[1]) return toast('Passwords do not match');
    const u = await sb.auth.updateUser({ password: r[0] }); toast(u.error ? u.error.message : '✅ Your password has been changed');
  }
  else if (a === 'setpw') {
    const g = genPw();
    const r = await dlg({ t: 'Set temporary password', p: 'For <b>' + e(b.dataset.n) + '</b>. Suggested: <b>' + g + '</b>', f: [{ l: `New temporary password (min. ${MINPW} characters; leave empty to use the suggestion)` }], ok: 'Set password' }); if (!r) return;
    const pw = r[0] || g;
    if (pw.length < MINPW) return toast(`Password must be at least ${MINPW} characters`);
    const u = await sb.rpc('admin_set_password', { target: id, new_password: pw });
    if (u.error) return toast(u.error.message);
    try { await navigator.clipboard.writeText(pw); } catch (_) {}
    toast('✅ Password set (copied). Share it with the student; they can change it with 🔑 after signing in.');
  }
  else if (a === 'deluser') {
    if (!await dlg({ t: 'Delete student permanently?', p: '<b>' + e(b.dataset.n) + '</b> will be removed from the database, including their account, progress and activity history. This cannot be undone.', ok: 'Delete permanently', danger: 1 })) return;
    busy(b, true);
    const r = await sb.rpc('admin_delete_user', { target: id });
    toast(r.error ? r.error.message : '🗑 Student deleted'); stView();
  }
  else if (a === 'addem') {
    const list = [...new Set($('#ae').value.toLowerCase().split(/[\s,;]+/).filter(x => /^\S+@\S+\.\S+$/.test(x)))];
    if (!list.length) return toast('Enter at least one valid email');
    busy(b, true);
    const r = await sb.from('allowed_emails').upsert(list.map(email => ({ email })));
    if (r.error) { busy(b, false); return toast(r.error.message); }
    for (let i = 0; i < list.length; i += 100) await sb.from('profiles').update({ status: 'approved' }).in('email', list.slice(i, i + 100)).eq('status', 'pending');
    toast('✅ ' + list.length + ' email(s) added'); emView();
  }
  else if (a === 'rmem') { busy(b, true); const r = await sb.from('allowed_emails').delete().eq('email', id); if (r.error) toast(r.error.message); emView(); }
  else if (a === 'lgmore') { busy(b, true); await lgMore(); }
}
