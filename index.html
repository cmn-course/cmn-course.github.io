<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a1630">
<title>Computer Maintenance &amp; Networking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💻%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--card:rgba(255,255,255,.86);--tx:#0b1220;--mu:#64748b;--pr:#0891b2;--pr2:#2563eb;--bd:#e2e8f2;--er:#dc2626;--sh:0 12px 40px -14px rgba(15,23,42,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#070b16;--card:rgba(20,27,46,.8);--tx:#e8ecf8;--mu:#97a3c0;--bd:#25304b;--sh:0 12px 40px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;font-family:'Plus Jakarta Sans','Noto Sans Ethiopic',system-ui,sans-serif;color:var(--tx);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 420px at 8% -10%,rgba(8,145,178,.16),transparent 60%),radial-gradient(700px 420px at 100% 0,rgba(37,99,235,.13),transparent 60%),var(--bg);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
h2,h3{margin:0 0 8px;letter-spacing:-.01em}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.mu,small{color:var(--mu)}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:28px 22px;margin:12px 0 18px;box-shadow:var(--sh);background:radial-gradient(circle at 85% 15%,rgba(34,211,238,.35),transparent 45%),linear-gradient(135deg,#0a1630,#10265a 60%,#0e3a6e);animation:up .6s both}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(120deg,transparent 20%,#000);mask-image:linear-gradient(120deg,transparent 20%,#000)}
.hero:after{content:"";position:absolute;width:230px;height:230px;right:-70px;bottom:-100px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 70%);animation:fl 6s ease-in-out infinite alternate;pointer-events:none}
.hero>:not(.deco){position:relative;z-index:1}
.deco{position:absolute;right:6px;top:6px;width:130px;opacity:.4;pointer-events:none}
.badge{display:inline-block;font:700 .66rem/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;color:#67e8f9;border:1px solid rgba(103,232,249,.45);padding:7px 11px;border-radius:99px;margin-bottom:14px}
.hero h1{margin:0 0 8px;font-size:clamp(1.7rem,6.4vw,2.5rem);font-weight:800;line-height:1.1;letter-spacing:-.035em}
.hero h1 span{background:linear-gradient(90deg,#67e8f9,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;opacity:.85;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chips b{font-weight:600;font-size:.76rem;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 11px;border-radius:10px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:8px;padding:10px 16px}
header small{max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{font-weight:800;flex:1;min-width:0;display:flex;gap:9px;align-items:center;letter-spacing:-.02em}.logo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo i{font-style:normal;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:11px;padding:4px 8px;box-shadow:0 4px 12px rgba(8,145,178,.4)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(8,145,178,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:default}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.r{background:var(--er);box-shadow:0 6px 16px rgba(220,38,38,.25)}.btn.s{padding:7px 12px;font-size:.82rem;border-radius:10px}.btn.w{width:100%}
.lnk{background:none;border:0;color:var(--pr);font-weight:600;font-size:.85rem;cursor:pointer;padding:4px 0}.lnk:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:8px 0 14px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.88rem}
.tabs button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.card{background:var(--card);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);animation:up .5s both;transition:transform .2s,box-shadow .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.doc{border-top:3px solid var(--pr)}.doc:hover{transform:translateY(-4px);box-shadow:0 16px 38px rgba(8,145,178,.24)}
.doc h3{font-size:1.04rem}.doc p{margin:0 0 12px;color:var(--mu);font-size:.88rem}.doc .m{font-size:.76rem;color:var(--mu);margin-bottom:12px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 6px 16px rgba(8,145,178,.35)}
.ico{font-size:2.2rem;margin-bottom:8px}
input,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 70%,transparent);margin:6px 0 12px;outline:0;transition:border .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(8,145,178,.2)}
label{font-size:.8rem;font-weight:600;color:var(--mu)}
.auth{max-width:440px;margin:5vh auto}.auth .tabs{justify-content:center}
.pw{position:relative}.pw input{padding-right:50px}.eye{position:absolute;right:8px;top:14px;border:0;background:none;font-size:1.2rem;cursor:pointer;padding:2px 6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row .i{flex:1;min-width:150px}.row .i b{display:block;overflow:hidden;text-overflow:ellipsis}.row .i small{word-break:break-all}
.tag{font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--bd)}.tag.approved{background:#dcfce7;color:#166534}.tag.pending{background:#fef3c7;color:#92400e}.tag.blocked{background:#fee2e2;color:#991b1b}
.center{text-align:center;padding:40px 16px;color:var(--mu)}.auth .center{padding:30px 18px}
.ra{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mo{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(2,6,23,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.mo .card{width:100%;max-width:400px;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:90vw;box-shadow:var(--sh)}#toast.on{opacity:1}
.sp{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
#viewer{position:fixed;inset:0;background:#1e2235;z-index:50;display:none;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#viewer.on{display:flex}
#viewer.fake{inset:auto;top:0;left:0;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100dvw) rotate(90deg)}
.vb{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#12152a;color:#fff;transition:transform .25s;z-index:2}.vb .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:.92rem}
.vb button{background:#2a3050;color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600}
.imm .vb{position:absolute;top:0;left:0;right:0;transform:translateY(-110%)}.imm.bar .vb{transform:none}
#pages{flex:1;overflow:auto;padding:10px 8px;text-align:center;-webkit-overflow-scrolling:touch}.imm #pages{padding:0}
.pg{margin:0 auto 10px;background:#fff;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.4)}.imm .pg{border-radius:0;margin-bottom:4px}.pg canvas{width:100%;height:100%;display:block;pointer-events:none}
@keyframes s{to{transform:rotate(360deg)}}@keyframes fl{to{transform:translate(-24px,-16px) scale(1.18)}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body,#viewer{display:none!important}}
</style>
</head>
<body>
<div id="app"><div class="sp"></div></div>
<div id="viewer" oncontextmenu="return false">
  <div class="vb"><button data-a="close" aria-label="Close">✕</button><span class="t"></span><span id="pn">1/1</span><button data-a="zo" aria-label="Zoom out">−</button><button data-a="zi" aria-label="Zoom in">+</button><button data-a="land" id="lb" aria-label="Landscape full screen">⟳ Landscape</button></div>
  <div id="pages"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
if (typeof SUPABASE_URL === 'undefined') { document.body.innerHTML = '<p style="padding:30px;font-family:sans-serif">config.js was not found.</p>'; throw new Error('config.js missing'); }
const B = Object.assign({ name: 'Computer Maintenance & Networking', accent: 'Maintenance', badge: 'FULL GUIDE MODULE', tagline: 'Complete Course Guide • Reference Module', chips: ['💽 Software', '🛠 Troubleshooting', '🌐 Networking'], owner: '', showUser: true, color1: '#0891b2', color2: '#2563eb' }, typeof BRAND !== 'undefined' ? BRAND : {});
if (!B.owner) B.owner = B.name;
document.title = B.name; document.documentElement.style.setProperty('--pr', B.color1); document.documentElement.style.setProperty('--pr2', B.color2);
const $ = s => document.querySelector(s), app = $('#app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heroTitle = () => B.accent ? e(B.name).replace(e(B.accent), () => '<span>' + e(B.accent) + '</span>') : e(B.name);
const fmtD = d => new Date(d).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
const mb = n => (n / 1048576).toFixed(1) + ' MB';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let tries = 0, me = null, tab = 'lib', mode = 'in', docs = [], pdf = null, sizes = [], cur = null, zoom = 1, obs = null, curPage = 1, saveT, docTok = 0, imm = false, fgEmail = '';
let rec = /type=recovery/.test(location.hash + location.search);
const hp = new URLSearchParams(location.hash.slice(1));
const linkErr = hp.get('error_description');

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 3600); }
const busy = (b, on) => { if (b) b.disabled = on; };
const hero = sub => `<div class="hero"><svg class="deco" viewBox="0 0 160 160" fill="none" stroke="#67e8f9" stroke-width="1.5"><path d="M20 120L60 70L100 90L140 30M60 70L50 30M100 90L130 130" opacity=".6"/><g fill="#0a1630"><circle cx="20" cy="120" r="7"/><circle cx="60" cy="70" r="9"/><circle cx="100" cy="90" r="7"/><circle cx="140" cy="30" r="8"/><circle cx="50" cy="30" r="6"/><circle cx="130" cy="130" r="6"/></g></svg><div class="badge">${e(B.badge)}</div><h1>${heroTitle()}</h1><p>${sub}</p><div class="chips">${B.chips.map(c => `<b>${e(c)}</b>`).join('')}</div></div>`;
const pwField = (id, label, ac) => `<label for="${id}">${label}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac}"><button type="button" class="eye" data-a="eye" data-t="${id}" aria-label="Show or hide password">👁</button></div>`;

/* ---------- dialogs (replace prompt/confirm) ---------- */
function dlg({ t, p = '', f = [], ok = 'Confirm', danger }) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'mo';
    m.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h3>${e(t)}</h3>${p ? `<p class="mu">${p}</p>` : ''}${f.map((x, i) => `<label>${e(x.l)}</label><input id="f${i}" type="${x.type || 'text'}" autocomplete="off">`).join('')}<div class="ra"><button class="btn g" data-k="0">Cancel</button><button class="btn ${danger ? 'r' : ''}" data-k="1">${e(ok)}</button></div></div>`;
    document.body.appendChild(m);
    const done = v => { m.remove(); res(v); };
    m.onclick = ev => { const k = ev.target.dataset.k; if (ev.target === m || k === '0') done(null); else if (k === '1') done(f.map((_, i) => m.querySelector('#f' + i).value)); };
    m.onkeydown = ev => { if (ev.key === 'Escape') done(null); if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') m.querySelector('[data-k="1"]').click(); };
    (m.querySelector('input') || m.querySelector('[data-k="1"]')).focus();
  });
}

/* ---------- routing ---------- */
async function route() {
  if (rec) return resetView();
  let { data: { session } } = await sb.auth.getSession();
  if (session) { const { error } = await sb.auth.getUser(); if (error && [401, 403, 404].includes(error.status)) { await sb.auth.signOut({ scope: 'local' }); session = null; toast('Your session has ended. Please sign in again.'); } }
  if (!session) { me = null; return authView(); }
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  me = data;
  if (!me) {
    if (!error && ++tries < 4) { await new Promise(r => setTimeout(r, 1200)); return route(); }
    tries = 0;
    app.innerHTML = `<div class="auth"><div class="card center"><div class="ico">⚠️</div><h2>Account unavailable</h2><p>${e(error?.message || 'Your account was not found. It may have been removed by your instructor.')}</p><button class="btn" data-a="refresh">Try again</button> <button class="btn g" data-a="out">Sign out</button></div></div>`;
    return;
  }
  if (me.status === 'approved') return appView();
  const blocked = me.status === 'blocked';
  app.innerHTML = `<div class="auth"><div class="card center"><div class="ico">${blocked ? '⛔' : '⏳'}</div><h2>${blocked ? 'Account suspended' : 'Awaiting approval'}</h2><p>${blocked ? 'Please contact your instructor.' : 'Your registration was received. Once your instructor approves it, refresh this page.'}</p><p><small>${e(me.email)}</small></p><button class="btn" data-a="refresh">Refresh</button> <button class="btn g" data-a="out">Sign out</button></div></div>`;
}
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && !rec) route(); if (ev === 'PASSWORD_RECOVERY') { rec = true; resetView(); } });
async function recheck() {
  if (document.visibilityState !== 'visible' || !me || rec) return;
  const { data } = await sb.from('profiles').select('status,role').eq('id', me.id).maybeSingle();
  if (!data || data.status !== me.status || data.role !== me.role) { closeDoc(); route(); }
}
document.addEventListener('visibilitychange', recheck); setInterval(recheck, 60000);

/* ---------- auth ---------- */
function authView() {
  if (mode === 'fg') return fgView(false);
  const v = { em: $('#em')?.value || '', nm: $('#nm')?.value || '', pw: $('#pw')?.value || '' }, reg = mode === 'up';
  app.innerHTML = `<div class="auth">${hero(reg ? 'Create your student account' : 'Sign in to continue')}
  <div class="card"><div class="tabs"><button class="${reg ? '' : 'on'}" data-a="m-in">Sign in</button><button class="${reg ? 'on' : ''}" data-a="m-up">Register</button></div>
  ${reg ? '<label for="nm">Full name</label><input id="nm" autocomplete="name">' : ''}
  <label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email">
  ${pwField('pw', reg ? 'Password (min. 6 characters)' : 'Password', reg ? 'new-password' : 'current-password')}
  ${reg ? '' : '<div style="text-align:right;margin:-4px 0 12px"><button class="lnk" data-a="m-fg">Forgot password?</button></div>'}
  <button class="btn w" data-a="auth" data-enter>${reg ? 'Create account' : 'Sign in'}</button></div></div>`;
  $('#em').value = v.em; $('#pw').value = v.pw; if ($('#nm')) $('#nm').value = v.nm;
}
function fgView(sent) {
  app.innerHTML = `<div class="auth">${hero('Account recovery')}<div class="card">${sent
    ? `<div class="ico" style="text-align:center">📬</div><h3 style="text-align:center">Check your inbox</h3><p class="mu" style="text-align:center">If an account exists for <b>${e(fgEmail)}</b>, a password reset link is on its way. Check your spam folder too.</p><button class="btn w" data-a="fg" data-enter>Resend link</button>`
    : `<h3>Forgot your password?</h3><p class="mu">Enter your email and we'll send you a secure link to create a new password.</p><label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email"><button class="btn w" data-a="fg" data-enter>Send reset link</button>`}
  <div style="text-align:center;margin-top:12px"><button class="lnk" data-a="m-in">← Back to sign in</button></div></div></div>`;
  if (!sent) { $('#em').value = fgEmail; return; }
  let n = 60; const b = $('[data-a=fg]'); b.disabled = true; b.textContent = 'Resend in 60s';
  const iv = setInterval(() => { if (!b.isConnected) return clearInterval(iv); n--; b.textContent = n > 0 ? `Resend in ${n}s` : 'Resend link'; b.disabled = n > 0; if (n <= 0) clearInterval(iv); }, 1000);
}
async function doFg(b) {
  const email = ($('#em')?.value ?? fgEmail).trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('Please enter a valid email address');
  fgEmail = email; busy(b, true);
  const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  busy(b, false);
  if (r.error) return toast(/rate|seconds/i.test(r.error.message) ? 'Please wait a minute before requesting another link' : r.error.message);
  fgView(true);
}
function resetView() {
  app.innerHTML = `<div class="auth">${hero('Create a new password')}<div class="card"><h3>Set a new password</h3><p class="mu">Choose a new password for your account. It replaces your old one immediately.</p>${pwField('np', 'New password (min. 6 characters)', 'new-password')}${pwField('np2', 'Confirm new password', 'new-password')}<button class="btn w" data-a="setnew" data-enter>Update password</button><div style="text-align:center;margin-top:12px"><button class="lnk" data-a="cancelrec">Cancel</button></div></div></div>`;
}
async function doSetNew(b) {
  const p = $('#np').value, p2 = $('#np2').value;
  if (p.length < 6) return toast('Password must be at least 6 characters');
  if (p !== p2) return toast('Passwords do not match');
  busy(b, true);
  const r = await sb.auth.updateUser({ password: p });
  busy(b, false);
  if (r.error) return toast(r.error.message);
  rec = false; history.replaceState(null, '', location.pathname); toast('✅ Password updated successfully'); route();
}
async function doAuth(b) {
  const email = $('#em').value.trim().toLowerCase(), password = $('#pw').value, name = $('#nm')?.value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email) || password.length < 6 || (mode === 'up' && !name)) return toast('Please fill in all fields correctly');
  busy(b, true);
  const r = mode === 'up'
    ? await sb.auth.signUp({ email, password, options: { data: { full_name: name } } })
    : await sb.auth.signInWithPassword({ email, password });
  busy(b, false);
  if (r.error) return toast(/invalid/i.test(r.error.message) ? 'Incorrect email or password' : r.error.message);
  if (mode === 'up' && r.data.user?.identities?.length === 0) return toast('This email is already registered. Please sign in.');
  if (mode === 'up' && !r.data.session) { mode = 'in'; authView(); return toast('Please confirm your email, then sign in'); }
  route();
}

/* ---------- main app ---------- */
async function appView() {
  const adm = me.role === 'admin';
  app.innerHTML = `<header><div class="wrap"><div class="logo"><i>💻</i><span>${e(B.name)}</span></div><small>${e(me.full_name || me.email)}</small><button class="btn g s" data-a="chpw" title="Change password" aria-label="Change password">🔑</button><button class="btn g s" data-a="out">Sign out</button></div></header>
  <div class="wrap">${hero('👋 Welcome, ' + e(me.full_name || ''))}
  ${adm ? `<div class="tabs">${[['lib', '📚 Library'], ['up', '⬆️ Upload'], ['st', '👥 Students'], ['em', '✉️ Allowed emails'], ['lg', '📊 Activity']].map(t => `<button class="${tab === t[0] ? 'on' : ''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>` : ''}
  <div id="main"><div class="sp"></div></div></div>`;
  ({ lib: libView, up: upView, st: stView, em: emView, lg: lgView }[adm ? tab : 'lib'])();
}
async function libView() {
  const { data } = await sb.from('documents').select('*').order('created_at', { ascending: false });
  docs = data || [];
  $('#main').innerHTML = !docs.length ? '<div class="card center"><div class="ico">📭</div>No files have been uploaded yet</div>' : `<input id="q" placeholder="🔍 Search..." aria-label="Search"><div class="grid" id="gl"></div>`;
  const draw = f => $('#gl').innerHTML = docs.filter(d => d.title.toLowerCase().includes(f)).map(d =>
    `<div class="card doc"><div class="dh"><div class="tile">📘</div><span class="badge" style="color:var(--pr);border-color:var(--pr);margin:0">GUIDE MODULE</span></div><h3>${e(d.title)}</h3><p>${e(d.description || '')}</p><div class="m">${mb(d.size_bytes || 0)} • ${fmtD(d.created_at)}</div><button class="btn w" data-a="open" data-id="${d.id}">📖 Read</button></div>`).join('') || '<div class="center" style="grid-column:1/-1">No matching files</div>';
  if (docs.length) { draw(''); $('#q').oninput = ev => draw(ev.target.value.toLowerCase()); }
}

/* ---------- protected viewer ---------- */
async function openDoc(id) {
  cur = docs.find(d => d.id === id); if (!cur) return;
  const tok = ++docTok, v = $('#viewer'), P = $('#pages'); v.classList.add('on'); v.querySelector('.t').textContent = cur.title;
  P.innerHTML = '<div class="sp"></div>'; document.body.style.overflow = 'hidden';
  sb.from('access_logs').insert({ user_id: me.id, document_id: cur.id }).then(() => {}, () => {});
  try {
    const { data, error } = await sb.storage.from('documents').createSignedUrl(cur.file_path, 120);
    if (error) throw error;
    const buf = await (await fetch(data.signedUrl)).arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true, standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/', isEvalSupported: false }).promise;
    const pgs = await Promise.all(Array.from({ length: doc.numPages }, (_, i) => doc.getPage(i + 1)));
    if (tok !== docTok) return;
    pdf = doc; sizes = pgs.map(p => { const w = p.getViewport({ scale: 1 }); return [w.width, w.height]; });
    const { data: pr } = await sb.from('progress').select('page').eq('user_id', me.id).eq('document_id', cur.id).maybeSingle();
    if (tok !== docTok) return;
    zoom = 1; layout(pr?.page || 1);
  } catch (x) { if (tok === docTok) { closeDoc(); toast('Unable to open this file'); } }
}
function layout(go) {
  if (!pdf) return;
  const P = $('#pages'); P.innerHTML = ''; obs?.disconnect();
  const w = Math.min(P.clientWidth - (imm ? 0 : 16), imm ? 1800 : 900) * zoom;
  obs = new IntersectionObserver(es => es.forEach(x => x.isIntersecting ? render(x.target) : unrender(x.target)), { root: P, rootMargin: '1400px 0px' });
  sizes.forEach(([pw, ph], i) => {
    const s = w / pw, d = document.createElement('div');
    d.className = 'pg'; d.dataset.n = i + 1; d.dataset.s = s; d.style.cssText = `width:${w}px;height:${ph * s}px`;
    P.appendChild(d); obs.observe(d);
  });
  P.children[Math.min(go, sizes.length) - 1]?.scrollIntoView(); updPage();
}
function unrender(d) { if (!d.dataset.r) return; d._k = (d._k || 0) + 1; delete d.dataset.r; const c = d.querySelector('canvas'); if (c) { c.width = c.height = 0; c.remove(); } }
async function render(d) {
  if (d.dataset.r || !pdf) return; d.dataset.r = 1; const k0 = d._k = (d._k || 0) + 1, doc = pdf;
  try {
    const p = await doc.getPage(+d.dataset.n), s = +d.dataset.s, base = p.getViewport({ scale: s });
    // high-quality render: >=2x pixel density, capped to stay within mobile canvas memory limits
    const k = Math.max(1, Math.min(Math.max(devicePixelRatio || 1, 2) * 1.25, 3.5, Math.sqrt(14e6 / (base.width * base.height))));
    const vp = p.getViewport({ scale: s * k }), c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height); x.imageSmoothingQuality = 'high';
    await p.render({ canvasContext: x, viewport: vp }).promise;
    if (d._k !== k0 || doc !== pdf) return;
    const wm = (txt, size, alpha, rows, off) => {
      x.save(); x.globalAlpha = alpha; x.fillStyle = '#000'; x.font = `600 ${size}px sans-serif`; x.rotate(-.5);
      for (let yy = -vp.height * .2 + off; yy < vp.height * 1.4; yy += vp.height / rows) for (let xx = -vp.width * .3; xx < vp.width; xx += vp.width * .8) x.fillText(txt, xx, yy);
      x.restore();
    };
    wm(B.owner, vp.width / 14, .07, 4, 0);
    if (B.showUser) wm((me.full_name || '') + ' • ' + me.email, vp.width / 36, .07, 8, vp.height / 16);
    d.appendChild(c);
  } catch (x) { if (d._k === k0) delete d.dataset.r; }
}
function updPage() {
  const P = $('#pages'), top = P.scrollTop + P.clientHeight / 3; let n = 1;
  for (const c of P.children) { if (!c.dataset.n) continue; if (c.offsetTop - P.offsetTop <= top) n = +c.dataset.n; else break; }
  curPage = n; $('#pn').textContent = n + '/' + (pdf?.numPages || 1);
  clearTimeout(saveT); saveT = setTimeout(saveProg, 1500);
}
function saveProg() { if (cur && pdf && me) sb.from('progress').upsert({ user_id: me.id, document_id: cur.id, page: curPage, updated_at: new Date() }).then(() => {}, () => {}); }
function closeDoc() {
  if (imm) immersive(false);
  clearTimeout(saveT); saveProg(); docTok++;
  $('#viewer').classList.remove('on'); $('#pages').innerHTML = ''; document.body.style.overflow = ''; pdf = null; cur = null; sizes = []; obs?.disconnect();
}
/* landscape + full-screen reading mode */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
async function immersive(on) {
  const v = $('#viewer');
  if (on) {
    imm = true; v.classList.add('imm', 'bar');
    try { const f = v.requestFullscreen || v.webkitRequestFullscreen; if (f) await f.call(v, { navigationUI: 'hide' }); } catch (_) {}
    try { await screen.orientation.lock('landscape'); } catch (_) {}
    $('#lb').textContent = '⤢ Exit';
    setTimeout(() => { v.classList.toggle('fake', innerHeight > innerWidth); layout(curPage); setTimeout(() => v.classList.remove('bar'), 2200); }, 450);
    toast('Tap the page to show or hide controls');
  } else {
    imm = false; v.classList.remove('imm', 'bar', 'fake'); $('#lb').textContent = '⟳ Landscape';
    try { screen.orientation.unlock(); } catch (_) {}
    if (fsEl()) try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (_) {}
    setTimeout(() => layout(curPage), 200);
  }
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(n => document.addEventListener(n, () => { if (imm && !fsEl()) immersive(false); }));
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!pdf) return; if (imm) $('#viewer').classList.toggle('fake', innerHeight > innerWidth); layout(curPage); }, 250); });
$('#pages').addEventListener('click', () => { if (imm) $('#viewer').classList.toggle('bar'); });
$('#pages').addEventListener('scroll', () => { clearTimeout(updPage._t); updPage._t = setTimeout(updPage, 120); });
addEventListener('keydown', k => {
  const on = $('#viewer').classList.contains('on');
  if (on && (k.ctrlKey || k.metaKey) && ['s', 'p', 'u', 'c'].includes(k.key.toLowerCase())) k.preventDefault();
  if (on && k.key === 'Escape' && !document.querySelector('.mo') && !imm) closeDoc();
});

/* ---------- admin ---------- */
function upView() {
  $('#main').innerHTML = `<div class="card"><h3>Upload a new PDF</h3><label for="t">Title</label><input id="t"><label for="ds">Description (optional)</label><textarea id="ds" rows="2"></textarea><label for="f">PDF file (up to 50 MB)</label><input id="f" type="file" accept="application/pdf"><button class="btn w" data-a="upload">⬆️ Upload</button></div>
  <h3 style="margin-top:20px">Uploaded files</h3><div class="card" id="dl"><div class="sp"></div></div>`;
  sb.from('documents').select('*').order('created_at', { ascending: false }).then(({ data }) => {
    docs = data || [];
    $('#dl').innerHTML = docs.map(d => `<div class="row"><div class="i"><b>${e(d.title)}</b><small>${mb(d.size_bytes || 0)} • ${fmtD(d.created_at)}</small></div><button class="btn r s" data-a="deldoc" data-id="${d.id}" title="Delete file" aria-label="Delete file">🗑</button></div>`).join('') || '<div class="center">Empty</div>';
  });
}
async function upload(b) {
  const f = $('#f').files[0], t = $('#t').value.trim();
  if (!t || !f) return toast('A title and a file are required');
  if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) return toast('Only PDF files are allowed');
  if (f.size > 52428800) return toast('File exceeds 50 MB');
  busy(b, true); b.textContent = '⏳ Uploading...';
  const path = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.pdf';
  const u = await sb.storage.from('documents').upload(path, f, { contentType: 'application/pdf' });
  if (u.error) { busy(b, false); b.textContent = '⬆️ Upload'; return toast(u.error.message); }
  const r = await sb.from('documents').insert({ title: t, description: $('#ds').value.trim(), file_path: path, size_bytes: f.size });
  if (r.error) await sb.storage.from('documents').remove([path]);
  toast(r.error ? r.error.message : '✅ Uploaded'); upView();
}
async function stView() {
  const { data } = await sb.from('profiles').select('*').neq('id', me.id).order('created_at', { ascending: false });
  const rank = { pending: 0, approved: 1, blocked: 2 }, list = (data || []).sort((a, b) => rank[a.status] - rank[b.status]);
  const np = list.filter(s => s.status === 'pending').length;
  $('#main').innerHTML = `<input id="q" placeholder="🔍 Search students..." aria-label="Search students"><p class="mu" style="margin:0 0 10px"><small>${list.length} accounts${np ? ` • <b>${np} awaiting approval</b>` : ''}</small></p><div class="card" id="sl"></div>`;
  const lab = { approved: 'Approved', pending: 'Pending', blocked: 'Blocked' };
  const draw = f => $('#sl').innerHTML = list.filter(s => ((s.full_name || '') + s.email).toLowerCase().includes(f)).map(s => `<div class="row"><div class="i"><b>${e(s.full_name || '—')}${s.role === 'admin' ? ' 👑' : ''}</b><small>${e(s.email)}</small></div><span class="tag ${s.status}">${lab[s.status] || e(s.status)}</span>
    ${s.status !== 'approved' ? `<button class="btn s" data-a="setst" data-id="${s.id}" data-v="approved" title="Approve" aria-label="Approve">✔</button>` : ''}${s.status !== 'blocked' ? `<button class="btn r s" data-a="setst" data-id="${s.id}" data-v="blocked" title="Block" aria-label="Block">⛔</button>` : ''}${s.status === 'approved' ? (s.role === 'admin' ? `<button class="btn g s" data-a="setrole" data-id="${s.id}" data-v="student">⬇ Remove admin</button>` : `<button class="btn g s" data-a="setrole" data-id="${s.id}" data-v="admin">👑 Make admin</button>`) : ''}<button class="btn g s" data-a="setpw" data-id="${s.id}" data-n="${e(s.email)}" title="Set temporary password" aria-label="Set temporary password">🔑</button>${s.role !== 'admin' ? `<button class="btn r s" data-a="deluser" data-id="${s.id}" data-n="${e(s.email)}" title="Delete permanently" aria-label="Delete permanently">🗑</button>` : ''}</div>`).join('') || '<div class="center">No students</div>';
  draw(''); $('#q').oninput = ev => draw(ev.target.value.toLowerCase());
}
async function emView() {
  const { data } = await sb.from('allowed_emails').select('*').order('created_at', { ascending: false });
  $('#main').innerHTML = `<div class="card"><h3>Student email allow-list</h3><p class="mu"><small>Students who register with these emails are approved instantly. One email per line, or separate with commas.</small></p><textarea id="ae" rows="5"></textarea><button class="btn w" data-a="addem">➕ Add</button></div>
  <div class="card" style="margin-top:14px">${(data || []).map(x => `<div class="row"><div class="i">${e(x.email)}</div><button class="btn r s" data-a="rmem" data-id="${e(x.email)}" aria-label="Remove">✕</button></div>`).join('') || '<div class="center">Empty</div>'}</div>`;
}
async function lgView() {
  const { data } = await sb.from('access_logs').select('created_at, profiles(full_name,email), documents(title)').order('created_at', { ascending: false }).limit(100);
  $('#main').innerHTML = `<div class="card">${(data || []).map(l => `<div class="row"><div class="i"><b>${e(l.profiles?.full_name || l.profiles?.email)}</b><small>${e(l.documents?.title || '')}</small></div><small>${fmtD(l.created_at)}</small></div>`).join('') || '<div class="center">No activity yet</div>'}</div>`;
}
const genPw = () => { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = crypto.getRandomValues(new Uint32Array(10)); return [...a].map(n => c[n % c.length]).join(''); };

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, id = b.dataset.id;
  if (a === 'm-in' || a === 'm-up' || a === 'm-fg') { mode = a === 'm-up' ? 'up' : a === 'm-fg' ? 'fg' : 'in'; authView(); }
  else if (a === 'auth') doAuth(b);
  else if (a === 'fg') doFg(b);
  else if (a === 'setnew') doSetNew(b);
  else if (a === 'cancelrec') { rec = false; history.replaceState(null, '', location.pathname); await sb.auth.signOut(); mode = 'in'; route(); }
  else if (a === 'eye') { const i = $('#' + b.dataset.t); const h = i.type === 'password'; i.type = h ? 'text' : 'password'; b.textContent = h ? '🙈' : '👁'; }
  else if (a === 'out') { closeDoc(); await sb.auth.signOut(); me = null; mode = 'in'; route(); }
  else if (a === 'refresh') route();
  else if (a === 'tab') { tab = b.dataset.t; appView(); }
  else if (a === 'open') openDoc(id);
  else if (a === 'close') closeDoc();
  else if (a === 'land') immersive(!imm);
  else if (a === 'zi' || a === 'zo') { zoom = Math.max(.6, Math.min(2.5, zoom + (a === 'zi' ? .25 : -.25))); layout(curPage); }
  else if (a === 'upload') upload(b);
  else if (a === 'deldoc') {
    if (!await dlg({ t: 'Delete this file?', p: 'The file will be permanently deleted for everyone.', ok: 'Delete', danger: 1 })) return;
    const d = docs.find(x => x.id === id), r = await sb.from('documents').delete().eq('id', id);
    if (r.error) return toast(r.error.message);
    if (d) await sb.storage.from('documents').remove([d.file_path]);
    upView();
  }
  else if (a === 'setst') { const r = await sb.from('profiles').update({ status: b.dataset.v }).eq('id', id); if (r.error) toast(r.error.message); stView(); }
  else if (a === 'setrole') {
    const up = b.dataset.v === 'admin';
    if (!await dlg({ t: up ? 'Grant admin access?' : 'Remove admin access?', p: up ? 'This person will be able to upload files and manage all students.' : 'This person will become a regular student.', ok: 'Confirm' })) return;
    const r = await sb.from('profiles').update({ role: b.dataset.v }).eq('id', id); if (r.error) toast(r.error.message); stView();
  }
  else if (a === 'chpw') {
    const r = await dlg({ t: 'Change your password', f: [{ l: 'New password (min. 6 characters)', type: 'password' }, { l: 'Confirm new password', type: 'password' }], ok: 'Update' }); if (!r) return;
    if (r[0].length < 6) return toast('Password must be at least 6 characters');
    if (r[0] !== r[1]) return toast('Passwords do not match');
    const u = await sb.auth.updateUser({ password: r[0] }); toast(u.error ? u.error.message : '✅ Your password has been changed');
  }
  else if (a === 'setpw') {
    const r = await dlg({ t: 'Set temporary password', p: 'For <b>' + b.dataset.n + '</b>. Suggested: <b>' + (window._g = genPw()) + '</b>', f: [{ l: 'New temporary password (min. 6 characters)' }], ok: 'Set password' }); if (!r) return;
    const pw = r[0] || window._g;
    if (pw.length < 6) return toast('Password must be at least 6 characters');
    const u = await sb.rpc('admin_set_password', { target: id, new_password: pw });
    if (u.error) return toast(u.error.message);
    try { await navigator.clipboard.writeText(pw); } catch (_) {}
    toast('✅ Password set (copied). Share it with the student; they can change it with 🔑 after signing in.');
  }
  else if (a === 'deluser') {
    if (!await dlg({ t: 'Delete student permanently?', p: '<b>' + b.dataset.n + '</b> will be removed from the database, including their account, progress and activity history. This cannot be undone.', ok: 'Delete permanently', danger: 1 })) return;
    const r = await sb.rpc('admin_delete_user', { target: id });
    toast(r.error ? r.error.message : '🗑 Student deleted'); stView();
  }
  else if (a === 'addem') {
    const list = [...new Set($('#ae').value.toLowerCase().split(/[\s,;]+/).filter(x => /^\S+@\S+\.\S+$/.test(x)))];
    if (!list.length) return toast('Enter at least one valid email');
    const r = await sb.from('allowed_emails').upsert(list.map(email => ({ email })));
    if (r.error) return toast(r.error.message);
    await sb.from('profiles').update({ status: 'approved' }).in('email', list).eq('status', 'pending');
    toast('✅ ' + list.length + ' email(s) added'); emView();
  }
  else if (a === 'rmem') { const r = await sb.from('allowed_emails').delete().eq('email', id); if (r.error) toast(r.error.message); emView(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.closest('.auth') && ev.target.tagName === 'INPUT') $('[data-enter]')?.click(); });
if (linkErr) { mode = 'fg'; history.replaceState(null, '', location.pathname); setTimeout(() => toast('This reset link is invalid or has expired. Please request a new one.'), 400); }
route();
</script>
