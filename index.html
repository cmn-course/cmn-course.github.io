<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#08122a">

<title>Course Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230891b2'/%3E%3Cg fill='none' stroke='white' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='9' cy='9' r='2.5' fill='white'/%3E%3Ccircle cx='23' cy='11' r='2.5' fill='white'/%3E%3Ccircle cx='15' cy='23' r='2.5' fill='white'/%3E%3Cpath d='M10.5 10.5l3 10M21.5 13l-5 8.5M11.5 9.5l9 1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --pr:#0891b2;--pr2:#2563eb;
  --bg:#f3f6fa;--card:#fff;--soft:#eaeff6;--tx:#0b1220;--mu:#586478;--bd:#dfe6ef;
  --lk:color-mix(in srgb,var(--pr) 72%,#000);
  --oktx:#166534;--okbg:#dcfce7;--watx:#92400e;--wabg:#fef3c7;--ertx:#991b1b;--erbg:#fee2e2;--er:#dc2626;
  --r-lg:22px;--r-md:16px;
  --fd:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#080d19;--card:#101829;--soft:#17213a;--tx:#e8edf9;--mu:#93a0ba;--bd:#222d47;
  --lk:color-mix(in srgb,var(--pr) 55%,#fff);
  --oktx:#86efac;--okbg:#0f2f1d;--watx:#fcd34d;--wabg:#3a2a0a;--ertx:#fca5a5;--erbg:#3b1417;
  color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#080d19;--card:#101829;--soft:#17213a;--tx:#e8edf9;--mu:#93a0ba;--bd:#222d47;
  --lk:color-mix(in srgb,var(--pr) 55%,#fff);
  --oktx:#86efac;--okbg:#0f2f1d;--watx:#fcd34d;--wabg:#3a2a0a;--ertx:#fca5a5;--erbg:#3b1417;
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--fb);font-size:16px;line-height:1.5;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;line-height:1.2}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
[hidden]{display:none!important}
svg{flex:none}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.page{padding-bottom:calc(48px + env(safe-area-inset-bottom))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-weight:600;transition:filter .15s,transform .1s,background .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.g:hover{background:var(--soft);filter:none}
.btn.r{background:var(--er);color:#fff}
.btn.s{min-height:36px;padding:0 12px;font-size:.85rem;border-radius:10px}
.btn.ic{width:40px;min-height:40px;padding:0}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed;filter:none;transform:none}
.btn.loading{position:relative;pointer-events:none}
.btn.loading>*{opacity:0}
.btn.loading{color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.g.loading::after{border-color:var(--bd);border-top-color:var(--pr)}
.lnk{background:none;border:0;padding:0;color:var(--lk);font-weight:600}
.lnk:hover{text-decoration:underline}
@keyframes spin{to{transform:rotate(360deg)}}

/* forms */
.f{margin-bottom:16px}
.f label,.lab{display:block;font-weight:600;font-size:.86rem;margin-bottom:6px}
.opt{font-weight:400;color:var(--mu)}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lrow label{margin-bottom:6px}.lrow .lnk{font-size:.86rem;margin-bottom:6px}
input,textarea{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
textarea{resize:vertical;min-height:84px}
.pw{position:relative}.pw input{padding-right:48px}
.eye{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--mu);border-radius:10px;display:grid;place-items:center}
.eye:hover{color:var(--tx);background:var(--soft)}
.hint{font-size:.8rem;color:var(--mu);margin-top:6px}
.tools{display:flex;gap:8px;margin-top:8px}
.msg{border-radius:12px;padding:11px 14px;font-size:.9rem;margin-bottom:14px}
.msg.err{background:var(--erbg);color:var(--ertx)}
.msg.ok{background:var(--okbg);color:var(--oktx)}
.meter{display:flex;align-items:center;gap:4px;margin-top:9px}
.meter i{flex:1;height:4px;border-radius:4px;background:var(--bd)}
.meter span{margin-left:8px;min-width:54px;font-size:.78rem;color:var(--mu)}
.meter[data-s="1"]{--mc:#ef4444}.meter[data-s="2"]{--mc:#f59e0b}.meter[data-s="3"]{--mc:#84cc16}.meter[data-s="4"]{--mc:#22c55e}
.meter[data-s="1"] i:nth-child(-n+1),.meter[data-s="2"] i:nth-child(-n+2),.meter[data-s="3"] i:nth-child(-n+3),.meter[data-s="4"] i:nth-child(-n+4){background:var(--mc)}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:var(--r-lg);padding:30px 26px;background:linear-gradient(150deg,#08122a 0%,#0c2150 58%,#0b3a6b 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(120deg,transparent 25%,#000);mask-image:linear-gradient(120deg,transparent 25%,#000)}
.hero .net{position:absolute;right:-24px;top:-8px;width:min(80%,430px);opacity:.55;pointer-events:none;-webkit-mask-image:linear-gradient(to left,#000 35%,transparent);mask-image:linear-gradient(to left,#000 35%,transparent)}
.hero .lk path{stroke-dasharray:3 8;animation:flow 2.6s linear infinite;opacity:.7}
@keyframes flow{to{stroke-dashoffset:-22}}
.hero .in{position:relative}
.hero h1{margin:0 0 10px;font-weight:700;font-size:clamp(2rem,6.4vw,3.35rem);line-height:1.04;letter-spacing:-.035em;max-width:16ch;text-wrap:balance}
.hero p{margin:0;opacity:.82;max-width:44ch}
.hero .hello{opacity:.78;margin-bottom:8px;font-size:.95rem}
.hero .tag-badge{display:inline-block;margin-bottom:14px;padding:5px 12px;border-radius:99px;border:1px solid rgba(103,232,249,.4);color:#a5f3fc;font-size:.8rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips b{font-weight:600;font-size:.82rem;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:99px}
.hero.sm{padding:24px 22px}
.hero.sm h1{font-size:clamp(1.55rem,4.6vw,2.4rem);max-width:none}
.hero.sm .chips{margin-top:14px}

/* auth */
.authwrap{min-height:100dvh;max-width:1080px;margin:0 auto;padding:16px;display:grid;gap:16px;align-content:center}
.authwrap .hero{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.auth{padding:26px 22px}
.auth h2{margin:0 0 6px;font-size:1.55rem}
.sub{color:var(--mu);margin:0 0 20px;font-size:.95rem}
.alt{text-align:center;margin:18px 0 0;color:var(--mu);font-size:.92rem}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;font-size:.9rem}
.bigicon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin-bottom:16px;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--lk)}
.bigicon.warn{background:var(--wabg);color:var(--watx)}.bigicon.bad{background:var(--erbg);color:var(--ertx)}
@media(min-width:900px){
  .authwrap{grid-template-columns:1.15fr .85fr;gap:24px;align-items:stretch}
  .authwrap .hero{display:flex;flex-direction:column;justify-content:flex-end;min-height:600px;padding:40px 36px}
  .authwrap .hero .net{width:480px;opacity:.9}
  .auth{padding:36px 32px;align-self:center}
}

/* header & nav */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--bd)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-family:var(--fd);font-weight:700;letter-spacing:-.01em}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}
.who{font-size:.86rem;color:var(--mu);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:4px}
@media(max-width:600px){.who{display:none}}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:14px;overflow-x:auto;scrollbar-width:none;max-width:100%;width:max-content}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:0 14px;min-height:38px;border-radius:10px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(11,18,32,.14)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--pr);color:#fff;font-size:.72rem;font-weight:700;display:inline-grid;place-items:center}
.nav{margin:18px 0 16px}

/* content */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);padding:18px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sh h2{margin:0;font-size:1.4rem}.sh small{color:var(--mu);font-weight:500;font-size:.9rem;margin-left:6px}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{padding-left:42px;margin:0;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.doc{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:20px 20px 20px 24px}
.doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--pr),var(--pr2))}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 13%,transparent);color:var(--lk)}
.pill-s{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mu)}
.doc h3{margin:4px 0 0;font-size:1.15rem}
.doc p{margin:0;color:var(--mu);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--mu);font-size:.82rem;margin:auto 0 4px;padding-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.row:first-child{padding-top:2px}.row:last-child{border:0;padding-bottom:2px}
.row .i{flex:1;min-width:190px}.row .i b{display:block;overflow-wrap:anywhere}.row .i small{color:var(--mu);overflow-wrap:anywhere}
.row .t{color:var(--mu);font-size:.82rem;white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--lk);font-weight:700;flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mu)}
.tag.approved{background:var(--okbg);color:var(--oktx)}.tag.pending{background:var(--wabg);color:var(--watx)}.tag.blocked{background:var(--erbg);color:var(--ertx)}
.crown{color:#d97706;vertical-align:-3px;margin-left:4px}
.center{text-align:center;padding:44px 18px;color:var(--mu)}
.center h3{color:var(--tx);margin:12px 0 6px;font-size:1.2rem}.center p{margin:0 auto 16px;max-width:40ch}
.center .bigicon{margin:0 auto}
.sec{margin:26px 0 12px;font-size:1.15rem}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:26px 16px;border:1.5px dashed var(--bd);border-radius:14px;color:var(--mu);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 6%,transparent)}
.drop b{color:var(--tx);overflow-wrap:anywhere}
.drop.has{border-style:solid;border-color:var(--pr)}
.sp{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}

/* dialog + toast */
dialog{border:0;border-radius:var(--r-lg);padding:0;background:var(--card);color:var(--tx);width:min(440px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(5,10,25,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog form{padding:24px}
dialog h3{margin:0 0 6px;font-size:1.3rem}
dialog .sub{margin-bottom:18px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;max-width:min(92vw,460px);font-size:.92rem;box-shadow:0 12px 40px rgba(0,0,0,.35);border-left:4px solid var(--pr)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-left-color:#22c55e}#toast.err{border-left-color:#ef4444}

/* reader */
#viewer{position:fixed;inset:0;height:100dvh;z-index:50;display:none;flex-direction:column;background:#141829;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#viewer.on{display:flex}
#viewer.rot{inset:auto;top:0;left:100%;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:rotate(90deg)}
.vb{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#0d1120;position:relative;z-index:3;transition:transform .25s ease}
.vb .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--fd);font-weight:600;padding-left:4px}
.vb button{background:rgba(255,255,255,.08);color:#fff;border:0;border-radius:10px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.vb button:hover{background:rgba(255,255,255,.17)}
.vb button.on{background:var(--pr)}
#pn{font-variant-numeric:tabular-nums;font-size:.86rem;opacity:.9;min-width:78px;padding:0 6px}
#bar{height:3px;background:rgba(255,255,255,.1);position:relative;z-index:3}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2))}
#pages{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}
#sheet{position:relative;width:max-content;min-width:100%;padding:12px 8px calc(28px + env(safe-area-inset-bottom))}
.pg{position:relative;margin:0 auto 12px;background:#fff;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.45);overflow:hidden}
.pg::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;color:#cbd2e0;font:600 2rem var(--fd)}
.pg[data-r="1"]::after{display:none}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.vload{display:grid;place-items:center;gap:6px;padding-top:18vh;color:#aab3cc;text-align:center}
#viewer.imm .vb{position:absolute;left:0;right:0;top:0;background:rgba(13,17,32,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#viewer.imm.hide .vb{transform:translateY(-115%)}
#viewer.imm #bar{position:absolute;top:0;left:0;right:0}
#viewer.imm #sheet{padding:0}
#viewer.imm .pg{margin-bottom:6px;border-radius:0;box-shadow:none}
#pill{display:none;position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;padding:6px 12px;border-radius:99px;background:rgba(13,17,32,.85);font-size:.8rem;font-variant-numeric:tabular-nums;pointer-events:none}
#viewer.imm.hide #pill{display:block}
@media(max-width:520px){.vb .t{display:none}#pn{flex:1;text-align:center}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{body{display:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:32px;font-family:sans-serif">JavaScript is required to use this site.</p></noscript>
<div id="app"><div class="sp"></div></div>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Document reader">
  <div class="vb">
    <button data-a="close" aria-label="Close reader" title="Close"></button>
    <span class="t"></span>
    <button id="pn" data-a="goto" aria-label="Go to page" title="Go to page">1 / 1</button>
    <button data-a="zo" aria-label="Zoom out" title="Zoom out"></button>
    <button data-a="zi" aria-label="Zoom in" title="Zoom in"></button>
    <button id="bland" data-a="land" aria-label="Landscape mode" title="Landscape mode"></button>
    <button id="bfs" data-a="fs" aria-label="Fullscreen" title="Fullscreen"></button>
  </div>
  <div id="bar"><i></i></div>
  <div id="pages"><div id="sheet"></div></div>
  <div id="pill">1 / 1</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ================= bootstrap ================= */
if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined' || typeof supabase === 'undefined') {
  document.getElementById('app').innerHTML = '<div style="max-width:460px;margin:20vh auto;padding:24px;font-family:system-ui,sans-serif;text-align:center"><h2 style="margin:0 0 8px">Setup required</h2><p style="color:#64748b;margin:0">The site configuration could not be loaded. Make sure <b>config.js</b> sits next to this file and defines <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b>.</p></div>';
  throw new Error('config.js missing or Supabase failed to load');
}

const B = Object.assign({
  name: 'Computer Maintenance & Networking',

function authErr(err) {
  const m = String(err?.message || '').toLowerCase();
  if (m.includes('invalid login') || m.includes('invalid credentials')) return 'Incorrect email or password.';
  if (m.includes('not confirmed')) return 'Please confirm your email first. Check your inbox for the confirmation link.';
  if (m.includes('already registered') || m.includes('already been registered')) return 'An account with this email already exists. Try signing in instead.';
  if (err?.status === 429 || m.includes('rate limit') || m.includes('too many')) return 'Too many attempts. Please wait a few minutes and try again.';
  if (m.includes('different from the old') || m.includes('same as the old')) return 'Your new password must be different from the old one.';
  if (m.includes('failed to fetch') || m.includes('network') || m.includes('load failed')) return 'Can’t reach the server. Check your internet connection and try again.';
  return err?.message || 'Something went wrong. Please try again.';
}

const pwField = (id, ac, o = {}) => `<div class="pw"><input id="${id}" type="password" autocomplete="${ac}" ${o.meter ? `data-meter="m-${id}"` : ''} required><button type="button" class="eye" data-a="eye" data-t="${id}" aria-label="Show password" aria-pressed="false">${ic('eye', 18)}</button></div>${o.meter ? `<div class="meter" id="m-${id}" data-s="0" aria-live="polite"><i></i><i></i><i></i><i></i><span></span></div>` : ''}`;
function strength(p) {
  if (!p) return 0;
  let s = (p.length >= MIN_PW) + (p.length >= 12) + (/[a-z]/.test(p) && /[A-Z]/.test(p)) + (/\d/.test(p) && /\D/.test(p)) + /[^A-Za-z0-9]/.test(p);
  if (p.length < MIN_PW) s = Math.min(s, 1);
  return Math.max(1, Math.min(4, s));
}
document.addEventListener('input', ev => {
  const id = ev.target.dataset?.meter; if (!id) return;
  const m = document.getElementById(id), s = strength(ev.target.value);
  m.dataset.s = s; m.querySelector('span').textContent = ['', 'Weak', 'Fair', 'Good', 'Strong'][s];
});
const pwCheck = (a, b) => a.length < MIN_PW ? `Use at least ${MIN_PW} characters.` : (a !== b ? 'The two passwords don’t match.' : '');
function genPw() {
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', a = new Uint32Array(12); crypto.getRandomValues(a);
  return [...a].map(n => cs[n % cs.length]).join('');
}

/* ================= routing ================= */
let me = null, tries = 0, rseq = 0, pollT, cdT, lastEmail = '', lastReset = 0;

async function route() {
  const my = ++rseq; clearTimeout(pollT);
  const { data: { session } } = await sb.auth.getSession();
  if (my !== rseq) return;
  if (!session) { store.del('recovery'); me = null; return authView(); }
  if (store.get('recovery')) return resetView();
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (my !== rseq) return;
  me = data;
  if (!me) {
    if (!error && ++tries < 4) { await new Promise(r => setTimeout(r, 1200)); return route(); }
    tries = 0;
    return statusView('alert', 'bad', 'We couldn’t load your profile', error?.message || 'Your profile hasn’t been created yet. Try again in a moment.', true);
  }
  tries = 0;
  if (me.status === 'approved') return appView();
  if (me.status === 'blocked') return statusView('ban', 'bad', 'Access blocked', 'Your account has been blocked. If you think this is a mistake, contact your instructor.', false);
  statusView('clock', 'warn', 'Waiting for approval', 'Your registration has been received. You’ll get access as soon as your instructor approves it. This page checks automatically.', true);
  pollT = setTimeout(route, 20000);
}
sb.auth.onAuthStateChange(ev => {
  if (ev === 'PASSWORD_RECOVERY') { store.set('recovery', '1'); setTimeout(route, 0); }
  else if (ev === 'SIGNED_OUT') setTimeout(route, 0);
});

/* form handlers */
const FORMS = {
  async 'f-in'() {
    const email = $('#em').value.trim().toLowerCase(), password = $('#pw').value;
    if (!validEmail(email)) return fmsg('err', 'Enter a valid email address.');
    if (!password) return fmsg('err', 'Enter your password.');
    const r = await sb.auth.signInWithPassword({ email, password });
    if (r.error) return fmsg('err', authErr(r.error));
    await route();
  },
  async 'f-up'() {
    const name = $('#nm').value.trim(), email = $('#em').value.trim().toLowerCase(), password = $('#pw').value;
    if (name.length < 2) return fmsg('err', 'Enter your full name.');
    if (!validEmail(email)) return fmsg('err', 'Enter a valid email address.');
    if (password.length < MIN_PW) return fmsg('err', `Use at least ${MIN_PW} characters for your password.`);
    const r = await sb.auth.signUp({ email, password, options: { data: { full_name: name }, emailRedirectTo: redirect() } });
    if (r.error) return fmsg('err', authErr(r.error));
    if (r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0) return fmsg('err', 'An account with this email already exists. Try signing in instead.');
    if (!r.data.session) { lastEmail = email; mode = 'confirm'; return authView(); }
    await route();
  },
  async 'f-forgot'() {
    const email = $('#em').value.trim().toLowerCase();
    if (!validEmail(email)) return fmsg('err', 'Enter a valid email address.');
    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirect() });
    if (r.error) return fmsg('err', (r.error.status === 429 || /rate/i.test(r.error.message)) ? 'Too many requests. Please wait a minute and try again.' : 'We couldn’t send the email right now. Please try again shortly.');
    lastEmail = email; lastReset = Date.now(); mode = 'sent'; authView();
  },
  async 'f-reset'() {
    const a = $('#np').value, b = $('#np2').value, err = pwCheck(a, b);
    if (err) return fmsg('err', err);
    const r = await sb.auth.updateUser({ password: a });
    if (r.error) return fmsg('err', authErr(r.error));
    store.del('recovery'); mode = 'in';
    history.replaceState(null, '', location.pathname + location.search);
    toast('Password updated. You’re signed in.', 'ok');
    await route();
  },
  async 'uf'() { await doUpload(); }
};
document.addEventListener('submit', async ev => {
  const h = FORMS[ev.target.id]; if (!h) return; ev.preventDefault();
  const btn = ev.target.querySelector('[type=submit]'); if (btn?.disabled) return;
  setBusy(btn, true);
  try { await h(ev.target); } catch (x) { $('#fm') ? fmsg('err', authErr(x)) : toast(authErr(x), 'err'); }
  finally { setBusy(btn, false); }
});

  const m = $('#main'); m.innerHTML = spinner;
  const { data, error } = await sb.from('access_logs').select('created_at, profiles(full_name,email), documents(title)').order('created_at', { ascending: false }).limit(100);
  if (error) return errBox(error.message);
  m.innerHTML = `<div class="sh"><h2>Recent activity<small>latest 100 opens</small></h2></div><div class="card">${(data || []).map(l => `<div class="row"><div class="av">${e(initials(l.profiles?.full_name || l.profiles?.email))}</div><div class="i"><b>${e(l.profiles?.full_name || l.profiles?.email || 'Unknown user')}</b><small>Opened ${e(l.documents?.title || 'a deleted document')}</small></div><span class="t">${fmtDT(l.created_at)}</span></div>`).join('') || '<div class="center">No activity yet.</div>'}</div>`;
}

/* ================= actions ================= */
async function done(r, okMsg, after) {
  if (r.error) return toast(r.error.message, 'err');
  toast(okMsg, 'ok'); after && after();
}
const A = {
  'm-in': () => { keepEmail(); mode = 'in'; authView(); },
  'm-up': () => { keepEmail(); mode = 'up'; authView(); },
  'm-forgot': () => { keepEmail(); mode = 'forgot'; authView(); },
  eye: b => { const i = document.getElementById(b.dataset.t), h = i.type === 'password'; i.type = h ? 'text' : 'password'; b.innerHTML = ic(h ? 'eyeOff' : 'eye', 18); b.setAttribute('aria-pressed', h); b.setAttribute('aria-label', h ? 'Hide password' : 'Show password'); },
  gen: b => { const i = document.getElementById(b.dataset.t); i.value = genPw(); i.type = 'text'; },
  async copy(b) { const v = document.getElementById(b.dataset.t).value; if (!v) return; try { await navigator.clipboard.writeText(v); toast('Copied to clipboard', 'ok'); } catch { toast('Couldn’t copy. Select and copy it manually.', 'err'); } },
  async resend() {
    if (!lastEmail || Date.now() - lastReset < 60000) return;
    const r = await sb.auth.resetPasswordForEmail(lastEmail, { redirectTo: redirect() });
    if (r.error) return toast(authErr(r.error), 'err');
    lastReset = Date.now(); toast('Reset email sent again', 'ok'); authView();
  },
  async out() { if (vw.classList.contains('on')) teardown(); store.del('recovery'); await sb.auth.signOut(); me = null; mode = 'in'; route(); },
  refresh: () => route(),
  retry: () => loadTab(),
  theme: b => { const n = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('theme', n); } catch {} b.innerHTML = ic(n === 'dark' ? 'sun' : 'moon', 18); },
  tab: b => { tab = b.dataset.t; drawTabs(); loadTab(); },
  flt: b => { stFilter = b.dataset.v; drawStudents(); },
  open: (b, id) => openDoc(id),
  close: () => closeDoc(),
  zi: () => zoomBy(.25), zo: () => zoomBy(-.25),
  land: () => toggleLand(), fs: () => toggleFS(),
  async goto() {
    if (!pdf) return; const n = pdf.numPages;
    const v = await ask({ title: 'Go to page', fields: [{ id: 'd-pg', label: `Page number (1–${n})`, type: 'number', attrs: `min="1" max="${n}" inputmode="numeric" value="${curPage}"` }], ok: 'Go', validate: v => { const x = +v['d-pg']; return (!Number.isInteger(x) || x < 1 || x > n) ? `Enter a number between 1 and ${n}.` : ''; } });
    if (!v) return; const t = S.children[+v['d-pg'] - 1]; if (t) P.scrollTop = t.offsetTop;
  },
  async deldoc(b, id) {
    const d = docs.find(x => x.id === id); if (!d) return;
    if (!await ask({ title: 'Delete this document?', text: `“${d.title}” will be permanently removed for everyone. This can’t be undone.`, ok: 'Delete', danger: true })) return;
    const s = await sb.storage.from('documents').remove([d.file_path]); if (s.error) return toast(s.error.message, 'err');
    await done(await sb.from('documents').delete().eq('id', id), 'Document deleted', upView);
  },
  async setst(b, id) {
    if (b.dataset.v === 'blocked' && !await ask({ title: 'Block this student?', text: `${b.dataset.n} will lose access immediately.`, ok: 'Block', danger: true })) return;
    await done(await sb.from('profiles').update({ status: b.dataset.v }).eq('id', id), b.dataset.v === 'approved' ? 'Student approved' : 'Student blocked', stView);
  },
  async setrole(b, id) {
    const adm = b.dataset.v === 'admin';
    if (!await ask({ title: adm ? 'Make this person an admin?' : 'Remove admin access?', text: adm ? `${b.dataset.n} will be able to upload files and manage students.` : `${b.dataset.n} will become a regular student.`, ok: adm ? 'Make admin' : 'Remove admin', danger: !adm })) return;
    await done(await sb.from('profiles').update({ role: b.dataset.v }).eq('id', id), adm ? 'Admin access granted' : 'Admin access removed', stView);
  },
  async chpw() {
    const v = await ask({ title: 'Change password', text: 'Choose a new password for your account.', ok: 'Update password', fields: [{ id: 'd-p1', label: 'New password', type: 'password', meter: true }, { id: 'd-p2', label: 'Confirm new password', type: 'password' }], validate: v => pwCheck(v['d-p1'], v['d-p2']) });
    if (!v) return;
    const r = await sb.auth.updateUser({ password: v['d-p1'] }); toast(r.error ? authErr(r.error) : 'Password updated', r.error ? 'err' : 'ok');
  },
  async setpw(b, id) {
    const v = await ask({ title: 'Set a temporary password', text: `For ${b.dataset.n}. Share it with them privately. They can change it after signing in.`, ok: 'Set password', fields: [{ id: 'd-ap', label: 'Temporary password', type: 'text', gen: true, attrs: 'spellcheck="false" autocapitalize="off"' }], validate: v => v['d-ap'].length < MIN_PW ? `Use at least ${MIN_PW} characters.` : '' });
    if (!v) return;
    const r = await sb.rpc('admin_set_password', { target: id, new_password: v['d-ap'] });
    toast(r.error ? r.error.message : 'Password updated. Let the student know.', r.error ? 'err' : 'ok');
  },
  async addem() {
    const list = [...new Set($('#ae').value.toLowerCase().split(/[\s,;]+/).filter(validEmail))];
    if (!list.length) return toast('Enter at least one valid email address.', 'err');
    const r = await sb.from('allowed_emails').upsert(list.map(email => ({ email }))); if (r.error) return toast(r.error.message, 'err');
    await sb.from('profiles').update({ status: 'approved' }).in('email', list).eq('status', 'pending');
    toast(`${list.length} ${list.length === 1 ? 'email' : 'emails'} added`, 'ok'); emView(); refreshPending();
  },
  async rmem(b, id) { await done(await sb.from('allowed_emails').delete().eq('email', id), 'Email removed', emView); }
};
function keepEmail() { const x = $('#em'); if (x) lastEmail = x.value.trim(); }

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if (!b || !A[b.dataset.a]) return;
  try { await A[b.dataset.a](b, b.dataset.id); } catch (x) { toast(x?.message || 'Something went wrong. Please try again.', 'err'); }
});
addEventListener('offline', () => toast('You’re offline. Some actions won’t work until you reconnect.', 'err'));
addEventListener('online', () => toast('Back online', 'ok'));

route();
</script>
</body>
</html>
